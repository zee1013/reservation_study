<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약하기</title>
    <!-- 파비콘 자리 -->
     <link rel="icon" type="image/png" href="/images/icon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="images/icon/favicon.svg" />
<link rel="shortcut icon" href="images/icon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="images/icon/apple-touch-icon.png" />
<link rel="manifest" href="images/icon/site.webmanifest" />
<!-- css 링크 -->
    <link rel="stylesheet" href="css/ex-reservation.css">
</head>
<body>
    <!-- 전체 -->
     <div id="wrap">
        <!-- 상단 메뉴 -->
         <nav class="navi">
            <ul>
                <li><a href="ex.html#info">이용안내</a></li>
                <li><a href="ex.html#room">객실소개</a></li>
                <li><a href="ex.html#pay">예약 방법 및 요금</a></li>
                <li><a href="#">예약하기</a></li>
            </ul>
         </nav>
         <!-- 예약하기 -->
          <form id="signUp">
            <!-- 개인정보 -->
          <fieldset>
            <legend>개인정보</legend>
            <ul class="user">
                <li>
                    <label for="user">이름</label>
                    <input type="text" id="user" placeholder="이름을 입력해 주세요." required>
                </li>
                <li>
                    <label for="tel">연락처</label>
                    <input type="text" id="tel" placeholder="010-0000-0000" required>
                </li>
            </ul>
          </fieldset>
          <!-- 객실형태 -->
          <fieldset>
            <legend>객실형태</legend>
            <ul class="room">
                <li>
                    <input type="radio" id="room" name="room">
                    <label for="room">기본형(최대 2인)</label>
                </li>
                <li>
                    <input type="radio" id="room-family" name="room">
                    <label for="room-family">가족형(최대 4인)</label>
                </li>
            </ul>
        </fieldset>
        <!-- 예약버튼 -->
        <div class="btn-wrap">
            <p>정보를 확인한 후 예약하기 버튼을 눌러주세요.</p>
            <button type="submit">예약하기</button>
           </div>
          </form>
